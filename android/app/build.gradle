plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.dailosman.c1bomberos'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.dailosman.c1bomberos"
        minSdk 24
        targetSdk 34
        versionCode project.hasProperty('numeroVersion') ? project.numeroVersion.toInteger() : 1
        versionName project.hasProperty('nombreVersion') ? project.nombreVersion : "1.0"
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }

    signingConfigs {
        comun {
            storeFile file('claves/reparto.keystore')
            storePassword 'android'
            keyAlias 'c1bomberos'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.comun
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.comun
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
