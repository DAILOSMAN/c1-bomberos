name: Compilar APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Revisar el entorno
        run: |
          {
            echo "## Entorno"
            echo '```'
            echo "java:   $(java -version 2>&1 | head -1)"
            echo "gradle: $(gradle --version 2>&1 | grep -i '^Gradle' | head -1)"
            echo "ANDROID_HOME: ${ANDROID_HOME:-(sin definir)}"
            echo "ANDROID_SDK_ROOT: ${ANDROID_SDK_ROOT:-(sin definir)}"
            echo "plataformas instaladas: $(ls "${ANDROID_HOME:-/nada}/platforms" 2>/dev/null | tr '\n' ' ')"
            echo "build-tools: $(ls "${ANDROID_HOME:-/nada}/build-tools" 2>/dev/null | tr '\n' ' ')"
            echo '```'
            echo "## Ficheros del proyecto"
            echo '```'
            find android -type f -not -path '*/build/*' | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Meter la app web dentro del APK
        run: |
          set -e
          destino=android/app/src/main/assets
          rm -rf "$destino"
          mkdir -p "$destino"
          cp index.html manifest.webmanifest "$destino"/
          cp -r css js icons "$destino"/
          {
            echo "## Contenido empaquetado"
            echo '```'
            find "$destino" -type f | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compilar
        id: compilar
        continue-on-error: true
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease \
            -PnumeroVersion=${{ github.run_number }} \
            -PnombreVersion=1.0.${{ github.run_number }} 2>&1 | tee ../salida.txt

      - name: Contar lo que ha pasado
        if: always()
        run: |
          {
            echo "## Compilación: ${{ steps.compilar.outcome }}"
            if [ -f salida.txt ]; then
              echo '```'
              tail -n 200 salida.txt
              echo '```'
            else
              echo "No se generó salida: el fallo fue antes de arrancar Gradle."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Parar aquí si no compiló
        if: steps.compilar.outcome != 'success'
        run: |
          echo "La compilación falló. El detalle está arriba, en el resumen."
          exit 1

      - name: Renombrar el APK
        run: |
          origen=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK generado: $origen"
          cp "$origen" TestC1Bomberos.apk
          ls -lh TestC1Bomberos.apk

      - name: Guardarlo también como artefacto de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: TestC1Bomberos-apk
          path: TestC1Bomberos.apk
          retention-days: 90

      - name: Publicarlo en Releases con enlace fijo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima TestC1Bomberos.apk \
            --title "Test C1 Bomberos 1.0.${{ github.run_number }}" \
            --latest \
            --notes "APK listo para instalar en Android 7 o superior. Descarga el fichero TestC1Bomberos.apk y ábrelo en el móvil."
