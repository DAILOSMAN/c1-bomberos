name: Compilar APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Revisar el entorno
        continue-on-error: true
        run: |
          mkdir -p registros
          {
            echo "=============================================="
            echo " ENTORNO"
            echo "=============================================="
            echo "fecha:            $(date -u '+%d/%m/%Y %H:%M:%S') UTC"
            echo "ejecucion:        ${{ github.run_number }}"
            echo "java:             $(java -version 2>&1 | head -1)"
            echo "gradle:           $(gradle --version 2>&1 | grep -i '^Gradle' | head -1)"
            echo "ANDROID_HOME:     ${ANDROID_HOME:-(SIN DEFINIR)}"
            echo "ANDROID_SDK_ROOT: ${ANDROID_SDK_ROOT:-(SIN DEFINIR)}"
            echo "plataformas:      $(ls "${ANDROID_HOME:-/nada}/platforms" 2>&1 | tr '\n' ' ')"
            echo "build-tools:      $(ls "${ANDROID_HOME:-/nada}/build-tools" 2>&1 | tr '\n' ' ')"
            echo "cmdline-tools:    $(ls "${ANDROID_HOME:-/nada}/cmdline-tools" 2>&1 | tr '\n' ' ')"
            echo ""
            echo "=============================================="
            echo " FICHEROS DEL PROYECTO"
            echo "=============================================="
            find android -type f -not -path '*/build/*' | sort
          } > registros/ultima-compilacion.txt 2>&1

      - name: Meter la app web dentro del APK
        continue-on-error: true
        run: |
          {
            echo ""
            echo "=============================================="
            echo " EMPAQUETADO DE LA APP WEB"
            echo "=============================================="
          } >> registros/ultima-compilacion.txt
          destino=android/app/src/main/assets
          rm -rf "$destino"
          mkdir -p "$destino"
          cp index.html manifest.webmanifest "$destino"/ 2>&1 | tee -a registros/ultima-compilacion.txt
          cp -r css js icons "$destino"/ 2>&1 | tee -a registros/ultima-compilacion.txt
          find "$destino" -type f | sort >> registros/ultima-compilacion.txt

      - name: Compilar
        id: compilar
        continue-on-error: true
        run: |
          {
            echo ""
            echo "=============================================="
            echo " SALIDA DE GRADLE"
            echo "=============================================="
          } >> registros/ultima-compilacion.txt
          set -o pipefail
          cd android
          gradle --no-daemon --stacktrace assembleRelease \
            -PnumeroVersion=${{ github.run_number }} \
            -PnombreVersion=1.0.${{ github.run_number }} 2>&1 \
            | tee -a ../registros/ultima-compilacion.txt

      - name: Guardar el registro en el repositorio
        if: always()
        run: |
          {
            echo ""
            echo "=============================================="
            echo " RESULTADO: ${{ steps.compilar.outcome }}"
            echo "=============================================="
          } >> registros/ultima-compilacion.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f registros/ultima-compilacion.txt
          git commit -m "Registro de la compilacion ${{ github.run_number }} [skip ci]" || echo "sin cambios que guardar"
          git pull --rebase --autostash || true
          git push || echo "no se pudo subir el registro"

      - name: Parar aquí si no compiló
        if: steps.compilar.outcome != 'success'
        run: |
          echo "La compilación falló. El detalle está en registros/ultima-compilacion.txt"
          exit 1

      - name: Renombrar el APK
        run: |
          origen=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK generado: $origen"
          cp "$origen" TestC1Bomberos.apk
          ls -lh TestC1Bomberos.apk

      - name: Guardarlo también como artefacto de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: TestC1Bomberos-apk
          path: TestC1Bomberos.apk
          retention-days: 90

      - name: Publicarlo en Releases con enlace fijo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima TestC1Bomberos.apk \
            --title "Test C1 Bomberos 1.0.${{ github.run_number }}" \
            --latest \
            --notes "APK listo para instalar en Android 7 o superior. Descarga el fichero TestC1Bomberos.apk y ábrelo en el móvil."
